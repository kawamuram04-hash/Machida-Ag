<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブリッジAI テスト送信</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; color: #333; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .version-info { font-size: 0.8rem; color: #666; margin-bottom: 20px; font-weight: bold; }
        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; justify-content: space-around; margin-top: 10px; }
        .seat-btn { padding: 18px 20px; font-size: 1.2rem; font-weight: bold; border: 2px solid #ccc; border-radius: 5px; background: white; cursor: pointer; width: 22%; -webkit-tap-highlight-color: transparent; }
        .seat-btn.selected { background: #007bff; color: white; border-color: #0056b3; }
        .upload-btn { display: inline-block; padding: 18px 30px; font-size: 1.2rem; background: #28a745; color: white; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .reset-btn { display: inline-block; padding: 10px 20px; font-size: 1rem; background: #6c757d; color: white; border-radius: 5px; cursor: pointer; margin-top: 15px; border: none; font-weight: bold; }
        .manual-box { display: none; margin-top: 20px; background: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffeeba; }
        .text-input { width: 85%; padding: 12px; font-size: 1.1rem; border: 2px solid #ccc; border-radius: 5px; text-transform: uppercase; font-family: monospace; font-weight: bold; margin-bottom: 10px; }
        .send-btn { padding: 12px 25px; font-size: 1.1rem; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h1>♣ ブリッジAI テスト送信 ♦</h1>
    <div class="version-info">Version: 2026/08/20-A (生データ送信テスト版)</div>

    <div class="section">
        <h3>1. 自分の席を選んでください</h3>
        <div class="btn-group">
            <button class="seat-btn" onclick="selectSeat('N')">N</button>
            <button class="seat-btn" onclick="selectSeat('S')">S</button>
            <button class="seat-btn" onclick="selectSeat('E')">E</button>
            <button class="seat-btn" onclick="selectSeat('W')">W</button>
        </div>
    </div>

    <div class="section">
        <h3>2. ハンドの写真を撮影または選択してください</h3>
        <label class="upload-btn">
            📷 写真を撮影・選択
            <input type="file" accept="image/*" id="camera-input" style="display:none;" onchange="processImage(this)">
        </label>
        <br>
        <button class="reset-btn" onclick="window.location.reload();">🔄 画面をリセット</button>
        
        <div id="manual-input-section" class="manual-box">
            <h4 style="color: #856404; margin-top:0;">📷 認識失敗のため手動入力に切り替わりました</h4>
            <input type="text" id="manual-text" class="text-input" placeholder="ここにハンドを入力">
            <br>
            <button class="send-btn" onclick="processManualInput()">✉️ 手動入力データを送信</button>
        </div>

        <div id="status" style="margin-top: 15px; font-weight: bold; color: #666; white-space: pre-wrap; line-height: 1.6;">席を選んで写真を撮影するか、わざとエラーにして手動入力をお試しください。</div>
    </div>

    <script>
        let selectedSeat = "";
        let errorCount = 0;
        let errorCode = 0;

        function selectSeat(seat) {
            selectedSeat = seat;
            document.querySelectorAll('.seat-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.innerText === seat) btn.classList.add('selected');
            });
            document.getElementById('status').innerText = `席「${seat}」が選択されました。`;
        }

        async function processImage(input) {
            if (!selectedSeat) { alert("最初に席を選択してください！"); input.value = ""; return; }
            const file = input.files;
            if (!file) return;
            const statusDiv = document.getElementById('status');
            const inputField = document.getElementById('manual-text');
            
            try {
                errorCode = 10;
                statusDiv.innerText = `[Code:${errorCode}] 画像を読み込みました。`;
                await new Promise(res => setTimeout(res, 500));

                errorCode = 20;
                statusDiv.innerText = `[Code:${errorCode}] AI起動中...`;
                const result = await Tesseract.recognize(file, 'eng');
                const rawText = result.data.text;

                errorCode = 30;
                let handString = formatBridgeHand(rawText); 
                if (handString && handString !== "READ_ERROR") {
                    inputField.value = handString;
                }
                if (!handString || handString === "READ_ERROR") throw new Error();

                errorCode = 50;
                statusDiv.innerText = `[Code:${errorCode}] 暗号化せずそのままスプレッドシートへ送信中...`;
                await sendDataToServer(selectedSeat, handString);

                statusDiv.innerHTML = `<span style='color:green; font-size:1.5rem;'>✓ 送信完了！</span><br>結果: ${selectedSeat}${handString}`;
            } catch (error) {
                errorCount++;
                statusDiv.innerHTML = `<span style='color:red;'>【エラー発生 (コード: ${errorCode})】</span>`;
                document.getElementById('manual-input-section').style.display = "block";
            }
        }

        async function processManualInput() {
            if (!selectedSeat) { alert("最初に席を選択してください！"); return; }
            const inputField = document.getElementById('manual-text');
            let rawText = inputField.value;
            const statusDiv = document.getElementById('status');
            if (!rawText) { alert("ハンドを入力してください！"); return; }
            
            try {
                errorCode = 80;
                statusDiv.innerText = `[Code:${errorCode}] 生データを送信中...`;
                
                // 【テスト変更】暗号化をスキップし、生の文字データをそのまま送信します
                let handString = formatBridgeHand(rawText);
                await sendDataToServer(selectedSeat, handString);

                statusDiv.innerHTML = `<span style='color:green; font-size:1.5rem;'>✓ 手動送信完了（テスト）！</span><br>データ: ${selectedSeat}${handString}`;
                document.getElementById('manual-input-section').style.display = "none";
            } catch (e) {
                statusDiv.innerHTML = `<span style='color:red;'>【手動送信エラー (コード: ${errorCode})】</span>`;
            }
        }

        function formatBridgeHand(text) {
            let cleanText = text.replace(/[^A-Za-z0-9]/g, "").toUpperCase();
            return cleanText ? cleanText : "READ_ERROR";
        }

        async function sendDataToServer(seat, rawString) {
const url = "https://script.google.com/macros/s/AKfycbyPiEIPpsg8CkvA3ekpZ2oQF71NYCwQzWY1OqohCg48B8-BQflw4I0Ec3cOM4nSxfxm7w/exec";
            // 【テスト変更】GAS側が最も読み取りやすいシンプルな文字形式に直して送信
            await fetch(url, { method: "POST", body: JSON.stringify({ seat: seat, data: rawString }) });
            return new Promise(res => setTimeout(res, 1000));
        }
    </script>
</body>
</html>
