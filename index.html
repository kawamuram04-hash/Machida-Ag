<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブリッジAI ハンド送信</title>
    <!-- 【7行目】今度こそ100%確実にcdn.とtesseract.jsを正しく組み込んだフルURLです -->
   <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; color: #333; }
        h1 { font-size: 1.5rem; }
        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn-group { display: flex; justify-content: space-around; margin-top: 10px; }
        .seat-btn { padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border: 2px solid #ccc; border-radius: 5px; background: white; cursor: pointer; width: 22%; }
        .seat-btn.selected { background: #007bff; color: white; border-color: #0056b3; }
        .upload-btn { display: inline-block; padding: 15px 30px; font-size: 1.2rem; background: #28a745; color: white; border-radius: 5px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .reset-btn { display: inline-block; padding: 10px 20px; font-size: 1rem; background: #6c757d; color: white; border-radius: 5px; cursor: pointer; margin-top: 15px; border: none; font-weight: bold; }
    </style>
</head>
<body>

    <h1>♣ ブリッジAI ハンド送信 ♦</h1>

    <!-- ステップ1: 席の選択 -->
    <div class="section">
        <h3>1. 自分の席を選んでください</h3>
        <div class="btn-group">
            <button class="seat-btn" onclick="selectSeat('N')">N</button>
            <button class="seat-btn" onclick="selectSeat('S')">S</button>
            <button class="seat-btn" onclick="selectSeat('E')">E</button>
            <button class="seat-btn" onclick="selectSeat('W')">W</button>
        </div>
    </div>

    <!-- ステップ2: 写真撮影と送信 -->
    <div class="section">
        <h3>2. ハンドの写真を撮影または選択してください</h3>
        <label class="upload-btn">
            📷 写真を撮影・選択
            <input type="file" accept="image/*" id="camera-input" style="display:none;" onchange="processImage(this)">
        </label>
        <br>
        <button class="reset-btn" onclick="window.location.reload();">🔄 画面をリセット</button>
        <div id="status" style="margin-top: 15px; font-weight: bold; color: #666;">席を選択して、ボタンを押してください。</div>
    </div>

    <script>
        let selectedSeat = "";

        // 席ボタンが押されたときの処理
        function selectSeat(seat) {
            selectedSeat = seat;
            document.querySelectorAll('.seat-btn').forEach(btn => {
                btn.classList.remove('selected');
                if(btn.innerText === seat) btn.classList.add('selected');
            });
            document.getElementById('status').innerText = `席「${seat}」が選択されました。写真を撮影または選択してください。`;
        }

        // 写真が撮影・選択されたあとの処理（全自動）
        async function processImage(input) {
            if (!selectedSeat) {
                alert("最初に席（N, S, E, W）を選択してください！");
                input.value = ""; // 入力をリセット
                return;
            }

            const file = input.files[0]; // 1つ目のファイルを確実に取得
            if (!file) return;

            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "画像を解析中...（しばらくお待ちください）";

            try {
                // 1. 画像からテキストを読み取る (ここでTesseract.jsの頭脳を使用します)
                const result = await Tesseract.recognize(file, 'eng');
                const rawText = result.data.text;

                // 2. 読み取ったテキストをブリッジのルール（SHDC順、強さ順）に整形する関数を呼び出す
                let handString = formatBridgeHand(rawText); 
                
                // テスト用に前回の文字列を代入（実際はOCRの結果から生成します）
                handString = "SAQTHKQT2DQ4C8752"; 

                // 3. 先頭に席の文字をくっつける
                const mergedString = selectedSeat + handString;
                statusDiv.innerText = `文字列化成功: ${mergedString} \n 整数に変換中...`;

                // 4. 36進数を10進数の整数（BigInt）に変換
                const decimalValue = base36ToDecimal(mergedString);

                statusDiv.innerText = `送信中... \n (変換後の整数: ${decimalValue.toString().substring(0, 10)}...)`;

                // 5. データを送信する (連絡係のデータ置き場へ)
                await sendDataToServer(selectedSeat, decimalValue.toString());

                statusDiv.innerHTML = "<span style='color:green; font-size:1.5rem;'>✓ 送信完了！</span><br>カードを伏せてお待ちください。";

            } catch (error) {
                console.error(error);
                statusDiv.innerHTML = "<span style='color:red;'>エラーが発生しました。もう一度撮影してください。</span>";
            }
        }

        // 文字列をブリッジのルールに並び替える関数（※枠組みのみ）
        function formatBridgeHand(text) {
            return "SAQTHKQT2DQ4C8752"; 
        }

        // 36進数の文字列を10進数の巨大整数に変換する関数
        function base36ToDecimal(str) {
            const alphabet = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let result = BigInt(0);
            for (let i = 0; i < str.length; i++) {
                const char = str[i].toUpperCase();
                const value = alphabet.indexOf(char);
                if (value === -1) continue;
                result = result * BigInt(36) + BigInt(value);
            }
            return result;
        }

        // データをデータ置き場（サーバーやスプレッドシート）に送る関数
        async function sendDataToServer(seat, integerString) {
            console.log(`サーバー送信: 席=${seat}, 整数=${integerString}`);
 const url = "https://script.google.com/macros/s/AKfycby884TuwejxkgqDDnSsaoH9m9bFd7ZbNElBbyLNrMIl_HUTqG8QtYG0aBFRnMYqn_aiyw/exec”；
     　　　　await fetch(url, { method: "POST", body: JSON.stringify({ seat: seat, data: integerString }) });
            return new Promise(resolve => setTimeout(resolve, 1000));
        }
    </script>
</body>
</html>
