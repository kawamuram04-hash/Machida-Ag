<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブリッジAI ハンド送信</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 15px; background: #f0f2f5; color: #333; }
        h1 { font-size: 1.4rem; margin-bottom: 5px; }
        .version-info { font-size: 0.8rem; color: #666; margin-bottom: 20px; font-weight: bold; }
        .section { background: white; padding: 20px 15px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .text-input { width: 100%; height: 100px; padding: 10px; font-size: 1rem; border: 2px solid #ccc; border-radius: 5px; box-sizing: border-box; font-family: monospace; font-weight: bold; margin-bottom: 20px; resize: vertical; }
        .send-btn { padding: 16px 25px; font-size: 1.2rem; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; box-sizing: border-box; }
        .send-btn:active { background: #0056b3; }
        
        .manager-toggle-btn { padding: 10px 20px; font-size: 1rem; background: #6c757d; color: white; border: none; border-radius: 5px; font-weight: bold; margin-bottom: 15px; cursor: pointer; }
        .manager-box { display: none; background: #fff3cd; padding: 20px 15px; border-radius: 10px; border: 2px solid #ffeeba; margin-bottom: 20px; text-align: left; }
        .select-group { margin-bottom: 15px; }
        .select-group label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.95rem; color: #856404; }
        .select-custom { width: 100%; padding: 12px; font-size: 1.1rem; border: 2px solid #ffeeba; border-radius: 5px; background: white; font-weight: bold; }
        .start-btn { padding: 16px 25px; font-size: 1.2rem; background: #28a745; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; box-sizing: border-box; }
        .start-btn:active { background: #1e7e34; }
        
        #status { margin-top: 20px; font-weight: bold; color: #666; text-align: center; width: 100%; }
        .result-box { text-align: center; background: #eee; padding: 12px 10px; border-radius: 5px; font-size: 0.85rem; width: 100%; box-sizing: border-box; word-break: break-all; font-family: monospace; margin: 10px auto 0 auto; display: block; }
    </style>
</head>
<body>
    <h1>♣ ブリッジAI ハンド送信 ♦</h1>
    <div class="version-info">Version: 2026/08/28-安全確認自動ビット変換版</div>
    
    <button class="manager-toggle-btn" id="toggle-btn" onclick="toggleManagerMode()">👤 連絡係メニューを開く</button>
    
    <div id="manager-section" class="manager-box">
        <h3 style="margin-top: 0; color: #856404; text-align: center; border-bottom: 1px dashed #ffeeba; padding-bottom: 10px;">👑 連絡係 専用コントロールパネル</h3>
        <div class="select-group">
            <label>▼  ステップ1：ディーラー（親）の選択</label>
            <select id="dealer-select" class="select-custom">
                <option value="N">N (北)</option>
                <option value="S">S (南)</option>
                <option value="E">E (東)</option>
                <option value="W">W (西)</option>
            </select>
        </div>
        <div class="select-group">
            <label>▼  ステップ2：AI (ロボット) の席を選択</label>
            <select id="ai-seat-select" class="select-custom">
                <option value="W">W (西 - デフォルト)</option>
                <option value="N">N (北)</option>
                <option value="S">S (南)</option>
                <option value="E">E (東)</option>
            </select>
        </div>
        <div class="select-group">
            <label>▼  ステップ3：AIのプレイスタイル選択</label>
            <select id="style-select" class="select-custom">
                <option value="積極的">積極的 (Aggressive)</option>
                <option value="慎重">慎重 (Conservative)</option>
                <option value="標準">標準 (Standard)</option>
            </select>
        </div>
        <label style="font-weight: bold; display: block; margin-bottom: 5px; font-size: 0.95rem; color: #856404;">▼  ステップ4：設定を確定してゲームを開始</label>
        <button class="start-btn" onclick="startNewGame()">🆕  新しいゲームを開始 (前後分割キー生成)</button>
    </div>

    <div id="common-input-section" class="section">
        <h3 id="input-title" style="margin-top: 0; color: #007bff; font-size: 1.1rem; line-height: 1.5;">📋 AIがテキスト化した手札（S: AK...）をそのまま貼り付けて送信してください</h3>
        <textarea id="hand-text-input" class="text-input" placeholder="例：S: AQ10 H: KQ102 D: Q4 C: 8752&#10;(大文字小文字、スペース、コロン等のズレは自動で処理されます)"></textarea>
        <br>
        <button class="send-btn" onclick="processAndSendHand()">✉️ 送信</button>
    </div>

    <div id="status" class="section" style="background: none; box-shadow: none; padding: 0;">手札テキストをボックスに貼り付けて、ボタンを押してください。</div>

    <script>
 const GAS_URL = "https://script.google.com/macros/s/AKfycbzM8f9g9CANqMOUFBO7EeiriLcAWGqVfYe4gcx8HsOjOuVz6q3yDUu0xiblDQo0kVK0FQ/exec";

        function toggleManagerMode() {
            const managerBox = document.getElementById('manager-section');
            const commonSection = document.getElementById('common-input-section');
            const toggleBtn = document.getElementById('toggle-btn');
            const statusDiv = document.getElementById('status');
            
            if (managerBox.style.display === "block") {
                managerBox.style.display = "none";
                commonSection.style.display = "block";
                toggleBtn.innerText = "👤 連絡係メニューを開く";
                toggleBtn.style.background = "#6c757d";
                statusDiv.innerText = "通常画面に戻りました。手札テキストを貼り付けて、ボタンを押してください。";
            } else {
                managerBox.style.display = "block";
                commonSection.style.display = "none";
                toggleBtn.innerText = "⬅ 戻る";
                toggleBtn.style.background = "#007bff";
                statusDiv.innerText = "初期情報を入力し、開始ボタンを押してください。";
            }
        }

                async function startNewGame() {
            const statusDiv = document.getElementById('status');
            const dealer = document.getElementById('dealer-select').value;
            const aiSeat = document.getElementById('ai-seat-select').value;
            const style = document.getElementById('style-select').value;
            
            statusDiv.innerText = "通信基地局（GAS）に新ゲーム開始を要請中...\n(26ビット分割キーK1・K2を自動生成しています)";
            
            try {
                const payload = {
                    action: "start_game",
                    dealer: dealer,
                    ai_seat: aiSeat,
                    style: style
                };
                
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    body: JSON.stringify(payload)
                });
                const result = await response.json();
                
                if(result.status === "success") {
                    statusDiv.innerHTML = "<span style='color:green; font-size:1.3rem;'>✓ ゲームが正常に開始されました！</span><br>「⬅ 戻る」ボタンを押して、各自の手札データを送信してください。";
                } else {
                    statusDiv.innerHTML = `<span style='color:red;'>❌ エラー: ${result.message}</span>`;
                }
            } catch (e) {
                statusDiv.innerHTML = "<span style='color:red;'>❌ 通信エラー</span><br>新ゲームの開始リクエストに失敗しました。";
            }
        }

                async function processAndSendHand() {
            const inputField = document.getElementById('hand-text-input');
            let rawText = inputField.value.trim().toUpperCase();
            const statusDiv = document.getElementById('status');
            
            if (!rawText) {
                alert("送信する手札のテキストを入力してください！");
                return;
            }
            
            statusDiv.innerText = "手札の文字列を解析中（T統一システム稼働）...";
            
            // Tを含む完全1文字ずつのマスタ配列（バグの起きない美しい並び）
            const ranks = ["A", "K", "Q", "J", "T", "9", "8", "7", "6", "5", "4", "3", "2"];
            const suits = ["S", "H", "D", "C"];
            let bits = Array(52).fill(0);
            
            let suitsData = { "S": "", "H": "", "D": "", "C": "" };
            let matches = rawText.match(/([SHDC])\s*[:：]?\s*([^SHDC]*)/g);
            
            if (!matches) {
                alert("エラー：手札の解析に失敗しました。形式（S: AKT9 H: KQJ...）が正しいか確認してください。");
                statusDiv.innerText = "送信を中断しました。形式を確認してください。";
                return;
            }
            
            matches.forEach(m => {
                let suit = m.trim().charAt(0);
                let cards = m.replace(/^[SHDC]\s*[:：]?\s*/, "").replace(/[^AKQJT0-9]/g, "");
                suitsData[suit] = cards;
            });
            
            let totalCount = 0;
            suits.forEach((suit, sIdx) => {
                let data = suitsData[suit];
                ranks.forEach((rank, rIdx) => {
                    let bitPosition = sIdx * 13 + rIdx;
                    // 全カードが1文字なので、単純に含む（includes）だけで100%正確に判定可能！
                    if (data.includes(rank)) {
                        bits[bitPosition] = 1;
                        totalCount++;
                    }
                });
            });
            
            if (totalCount !== 13) {
                if (!confirm("警告：検出されたカードが13枚ではありません（現在 " + totalCount + " 枚）。このまま送信しますか？")) {
                    statusDiv.innerText = "送信をキャンセルしました。手札を修正してください。";
                    return;
                }
            }
            
            let bitString = bits.join("");
            let part1Bits = bitString.substring(0, 26);
            let part2Bits = bitString.substring(26, 52);
            let int1 = parseInt(part1Bits, 2);
            let int2 = parseInt(part2Bits, 2);
            
            statusDiv.innerText = "通信基地局（GAS）へ安全データを射出中...";
            
            try {
                const payload = {
                    action: "send_data",
                    int1: int1,
                    int2: int2,
                    raw: bitString
                };

                const response = await fetch(GAS_URL, { 
                    method: "POST", 
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                statusDiv.innerHTML = `
                    <div style='color:green; font-size:1.5rem; margin-bottom:5px;'>✓ 安全送信完了！</div>
                    <div style='font-size:0.9rem; color:#333; margin-bottom:10px;'>正確なデータがC列・D列に記録されました。</div>
                    <div class='result-box'>
                        <div style='font-weight:bold; margin-bottom:2px;'>【システム自動解析結果】</div>
                        合計枚数: <span style="color:green; font-weight:bold">${totalCount}枚</span><br>
                        前半(C列): <span style="color:#007bff">${int1}</span> / 後半(D列): <span style="color:#007bff">${int2}</span>
                    </div>`;
                
                inputField.value = "";
                
            } catch (e) {
                statusDiv.innerHTML = "<div style='color:red; font-size:1.1rem;'>❌ 送信エラー</div><div style='font-size:0.9rem; margin-top:5px;'>通信に失敗しました。</div>";
            }
        }
    </script>
</body>
</html>
