<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブリッジAI 整数送信</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; color: #333; }
        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        .version-info { font-size: 0.8rem; color: #666; margin-bottom: 25px; font-weight: bold; }
        .section { background: white; padding: 25px 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .text-input { width: 90%; padding: 15px 10px; font-size: 1.2rem; border: 2px solid #ccc; border-radius: 5px; font-family: monospace; font-weight: bold; text-align: center; margin-bottom: 20px; box-sizing: border-box; }
        .send-btn { padding: 16px 25px; font-size: 1.2rem; background: #007bff; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 90%; -webkit-tap-highlight-color: transparent; }
        .send-btn:active { background: #0056b3; }
        #status { margin-top: 20px; font-weight: bold; color: #666; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>

    <h1>♣ ブリッジAI 整数送信 ♦</h1>
    <div class="version-info">Version: 2026/08/21-B (整数コピペ専用版)</div>

    <div class="section">
        <h3 style="margin-top: 0; color: #007bff;">📋 AIの計算結果（10進整数）を貼り付けてください</h3>
        
        <!-- 10進整数を受け付ける専用の入力ボックス -->
        <input type="text" id="decimal-input" class="text-input" inputmode="numeric" pattern="[0-9]*" placeholder="例: 29009857...">
        <br>
        
        <!-- 送信一発ボタン -->
        <button class="send-btn" onclick="sendDecimalData()">✉️ スプレッドシートへ送信</button>

        <div id="status">ボックスに数字を貼り付けて、ボタンを押してください。</div>
    </div>

    <script>
        async function sendDecimalData() {
            const inputField = document.getElementById('decimal-input');
            let rawText = inputField.value.trim();
            const statusDiv = document.getElementById('status');
            
            // 数字以外の文字（スペースや改行など）を完全に排除
            let cleanNumber = rawText.replace(/[^0-9]/g, "");
            
            if (!cleanNumber) {
                alert("送信する10進整数（数字）を入力してください！");
                return;
            }
            
            statusDiv.innerText = "通信基地局（GAS）へ送信中...";
            
            try {
                // 【確定した本物URL】席情報は不要なため、seatは空文字 "" で送信します
                const url = "https://script.google.com/macros/s/AKfycbyPiEIPpsg8CkvA3ekpZ2oQF71NYCwQzWY1OqohCg48B8-BQflw4I0Ec3cOM4nSxfxm7w/exec";
                
                await fetch(url, { 
                    method: "POST", 
                    body: JSON.stringify({ 
                        seat: "", 
                        data: cleanNumber 
                    }) 
                });

                statusDiv.innerHTML = `
                    <span style='color:green; font-size:1.5rem;'>✓ 送信完了！</span><br>
                    スプレッドシートに整数が記録されました。<br><br>
                    <div style='text-align:left; background:#eee; padding:10px; border-radius:5px; font-size:0.9rem; max-width:280px; margin:0 auto; word-break:break-all;'>
                        <strong>【送信されたデータ】</strong><br>
                        <code>${cleanNumber}</code>
                    </div>`;
                
                // 次の入力のためにボックスを空にする
                inputField.value = "";
                
            } catch (e) {
                statusDiv.innerHTML = "<span style='color:red;'>❌ 送信エラー（コード: 90）</span><br>通信に失敗しました。電波状況を確認してください。";
            }
        }
    </script>
</body>
</html>
