<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハンドの入力 (.index)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-alert: #df2020;
            --bg-display: #2c3e50;
            --text-display: #f1c40f;
            --btn-green: #2ecc71;
            --btn-green-hover: #27ae60;
            --btn-red: #e74c3c;
            --btn-blue: #007aff;
            --border-color: #cccccc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 10px 12px;
            border: 2px solid #3498db;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: bold;
            color: #1a5276;
        }

        .sub-header-alert {
            color: var(--text-alert);
            font-weight: bold;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .suit-selector-zone {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            background: #ecf0f1;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .suit-select-btn {
            height: 44px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suit-select-btn.active-suit {
            font-size: 1.8rem;
            border-color: var(--btn-blue);
            background: #e0f0ff;
            font-weight: bold;
        }

        .display-monitor {
            background: var(--bg-display);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border: 2px solid #34495e;
        }

        .display-text {
            color: var(--text-display);
            font-size: 1.1rem;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 0.5px;
            overflow-x: auto;
            white-space: nowrap;
            width: 82%;
            text-align: left;
        }

        .clickable-card {
            display: inline-block;
            padding: 1px 2px;
            border-radius: 4px;
            transition: all 0.1s;
        }

        body.eraser-active .clickable-card {
            cursor: pointer;
            background: rgba(231, 76, 60, 0.15);
            border: 1px dashed var(--btn-red);
            color: #ff6b6b;
        }

        .counter-badge {
            color: var(--btn-green);
            font-size: 1.7rem;
            font-weight: bold;
            font-family: monospace;
        }

        .guidance-box {
            background: #fff9e6;
            border: 1px solid #f39c12;
            border-radius: 6px;
            padding: 8px;
            color: #d35400;
            font-size: 0.88rem;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .rank-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            margin-bottom: 5px;
        }

        .key-btn {
            height: 44px;
            border: none;
            border-radius: 6px;
            background: var(--btn-green);
            color: white;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-btn.selected {
            background: #2980b9;
        }

        .mode-control-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            background: #f8f9fa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .icon-mode-btn {
            height: 48px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: white;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: #7f8c8d;
            opacity: 0.4;
            transition: all 0.15s ease;
        }

        .icon-mode-btn span.icon {
            font-size: 1.3rem;
            margin-bottom: 1px;
        }

        .icon-mode-btn.pencil-btn.active-mode {
            opacity: 1;
            border-color: var(--btn-green);
            color: var(--text-main);
            background: #f4fbf7;
        }

        .icon-mode-btn.eraser-btn.active-mode {
            opacity: 1;
            border-color: var(--btn-red);
            color: var(--btn-red);
            background: #fff5f5;
        }

        .clear-action-btn {
            height: 44px;
            border: none;
            border-radius: 6px;
            background: #95a5a6;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-container {
            margin-top: 5px;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: none;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            background: var(--btn-blue);
        }

        .action-btn:disabled {
            background: var(--btn-gray) !important;
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🖐 ハンドの入力 (.index)</h1>
        <div style="font-size: 1.2rem;">🧼</div>
    </header>
    <div class="sub-header-alert">※プレイヤーの方は、ここだけ作業をしてください。</div>

    <div class="suit-selector-zone">
        <button class="suit-select-btn active-suit" data-suit="S">S</button>
        <button class="suit-select-btn" data-suit="H">H</button>
        <button class="suit-select-btn" data-suit="D">D</button>
        <button class="suit-select-btn" data-suit="C">C</button>
    </div>

    <div class="display-monitor">
        <div class="display-text" id="displayText"></div>
        <div class="counter-badge" id="cardCounter">0</div>
    </div>

    <div class="guidance-box" id="guidanceBox">カードを選んでタップしてください。</div>

    <div class="rank-grid">
        <button class="key-btn" data-rank="A">A</button>
        <button class="key-btn" data-rank="K">K</button>
        <button class="key-btn" data-rank="Q">Q</button>
        <button class="key-btn" data-rank="J">J</button>
        <button class="key-btn" data-rank="T">T</button>
        <button class="key-btn" data-rank="9">9</button>
        <button class="key-btn" data-rank="8">8</button>
    </div>
    <div class="rank-grid" style="margin-bottom: 10px;">
        <button class="key-btn" data-rank="7">7</button>
        <button class="key-btn" data-rank="6">6</button>
        <button class="key-btn" data-rank="5">5</button>
        <button class="key-btn" data-rank="4">4</button>
        <button class="key-btn" data-rank="3">3</button>
        <button class="key-btn" data-rank="2">2</button>
        <button class="clear-action-btn" id="clearBtn">最初から</button>
    </div>

    <div class="mode-control-zone">
        <button class="icon-mode-btn pencil-btn active-mode" id="pencilModeBtn">
            <span class="icon">✏️</span>
            <span>鉛筆モード (入力)</span>
        </button>
        <button class="icon-mode-btn eraser-btn" id="eraserModeBtn">
            <span class="icon">🧹</span>
            <span>消しゴムモード (消去)</span>
        </button>
    </div>

    <div class="action-container">
        <button id="okActionBtn" class="action-btn" disabled>OK (スプレッドシートへ確定送信)</button>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbygAPVWSVTInhfQ3cx3-VkQk1WhHVA3iozzCn3--"+
     "FuJh5-DPIRSBFZb4ubCRkTCav-QfQ/exec";

    const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
    const SUITS = ['S', 'H', 'D', 'C'];

    let currentSuit = 'S';
    let isEraserMode = false;

    let cardMatrix = {
        S: new Array(13).fill(""),
        H: new Array(13).fill(""),
        D: new Array(13).fill(""),
        C: new Array(13).fill("")
    };

    const displayText = document.getElementById('displayText');
    const cardCounter = document.getElementById('cardCounter');
const guidanceBox = document.getElementById('guidanceBox');
const okActionBtn = document.getElementById('okActionBtn');
const clearBtn = document.getElementById('clearBtn');
const pencilModeBtn = document.getElementById('pencilModeBtn');
const eraserModeBtn = document.getElementById('eraserModeBtn');
function countSelectedCards() {
let total = 0;
SUITS.forEach(suit => {
total += cardMatrix[suit].filter(val => val !== "").length;
});
return total;
}
document.querySelectorAll('.suit-select-btn').forEach(btn => {
btn.addEventListener('click', () => {
document.querySelectorAll('.suit-select-btn').forEach(b => b.classList.remove('active-suit'));
btn.classList.add('active-suit');
currentSuit = btn.dataset.suit;
updateKeyboardStyles();
});
});
pencilModeBtn.addEventListener('click', () => { setEraserMode(false); });
eraserModeBtn.addEventListener('click', () => { setEraserMode(true); });
function setEraserMode(active) {
isEraserMode = active;
if (isEraserMode) {
document.body.classList.add('eraser-active');
eraserModeBtn.classList.add('active-mode');
pencilModeBtn.classList.remove('active-mode');
guidanceBox.innerHTML = "【消しゴム稼働中】モニター内の消したいカード文字を直接タップしてください。";
} else {
document.body.classList.remove('eraser-active');
pencilModeBtn.classList.add('active-mode');
eraserModeBtn.classList.remove('active-mode');
syncStateToUI();
}
}
document.querySelectorAll('.rank-grid .key-btn:not(.clear-action-btn)').forEach(btn => {
btn.addEventListener('click', () => {
if (isEraserMode) return;
const rank = btn.dataset.rank;
const r_ix = RANKS.indexOf(rank);
const totalCount = countSelectedCards();
if (totalCount === 13 && cardMatrix[currentSuit][r_ix] === "") {
guidanceBox.innerHTML = "⚠️ カード枚数が13枚を超えるため、実行できません";
return;
}
if (cardMatrix[currentSuit][r_ix] === "") {
cardMatrix[currentSuit][r_ix] = rank;
} else {
cardMatrix[currentSuit][r_ix] = "";
}
syncStateToUI();
});
});
clearBtn.addEventListener('click', () => {
SUITS.forEach(suit => cardMatrix[suit].fill(""));
document.querySelectorAll('.suit-select-btn').forEach(b => b.classList.remove('active-suit'));
document.querySelector('.suit-select-btn[data-suit="S"]').classList.add('active-suit');
currentSuit = 'S';
setEraserMode(false);
});
function updateKeyboardStyles() {
document.querySelectorAll('.rank-grid .key-btn:not(.clear-action-btn)').forEach(btn => {
const r_ix = RANKS.indexOf(btn.dataset.rank);
btn.classList.toggle('selected', cardMatrix[currentSuit][r_ix] !== "");
});
}
function syncStateToUI() {
displayText.innerHTML = "";
SUITS.forEach(suit => {
const hasCards = cardMatrix[suit].some(val => val !== "");
if (hasCards) {
const suitSpan = document.createElement('span');
suitSpan.innerText = suit;
displayText.appendChild(suitSpan);
RANKS.forEach(rank => {
const r_ix = RANKS.indexOf(rank);
if (cardMatrix[suit][r_ix] !== "") {
const cardSpan = document.createElement('span');
cardSpan.className = "clickable-card";
cardSpan.innerText = rank;
cardSpan.addEventListener('click', (e) => {
if (!isEraserMode) return;
e.stopPropagation();
cardMatrix[suit][r_ix] = "";
setEraserMode(false);
});
displayText.appendChild(cardSpan);
}
});
}
});
const count = countSelectedCards();
cardCounter.innerText = count;
updateKeyboardStyles();
if (!isEraserMode) {
if (count === 13) {
guidanceBox.innerHTML = "１３枚揃っています。最終確認をして、OKボタンを押して下さい。";
okActionBtn.disabled = false;
} else {
guidanceBox.innerHTML = "カードを選んでタップしてください。誤りは作成中に見つけて、消しゴムで修正しておいてください。";
okActionBtn.disabled = true;
}
}
}
okActionBtn.addEventListener('click', async () => {
const count = countSelectedCards();
if (count !== 13) return;
let bitVector = new Array(52).fill(false);
let bitPosition = 0;
SUITS.forEach(suit => {
RANKS.forEach(rank => {
const r_ix = RANKS.indexOf(rank);
if (cardMatrix[suit][r_ix] !== "") {
bitVector[bitPosition] = true;
}
bitPosition++;
});
});
const int1 = bitVector.slice(0, 26).reduce((acc, curr) => { return (acc << 1) | (curr ? 1 : 0); }, 0);
const int2 = bitVector.slice(26, 52).reduce((acc, curr) => { return (acc << 1) | (curr ? 1 : 0); }, 0);
let bitString = "";
for (let i = 0; i < 52; i++) {
bitString += bitVector[i] ? "1" : "0";
}
okActionBtn.disabled = true;
guidanceBox.innerHTML = "🚀 スプレッドシートへデータを安全に送信中...";
try {
const payload = {
action: "send_data",
int1: int1,
int2: int2,
raw: bitString
};
const response = await fetch(GAS_URL, {
method: "POST",
mode: "cors",
headers: {
"Content-Type": "text/plain"
},
body: JSON.stringify(payload)
});
const result = await response.json();
if (result.status === "success") {
guidanceBox.innerHTML = "✨ 送信完了：正確なデータがC列・D列に記録されました！ブラウザを閉じて大丈夫です。";
} else {
throw new Error();
}
} catch (error) {
guidanceBox.innerHTML = "⚠️ 送信に失敗しました。再起動するか、通信環境を確認してください。";
okActionBtn.disabled = false;
}
});
syncStateToUI();
</script>
</body>
</html>
