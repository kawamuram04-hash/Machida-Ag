<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ハンドの手入力 (.direct)</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-alert: #df2020;
            --bg-display: #2c3e50;
            --text-display: #f1c40f;
            --btn-blue: #007aff;
            --border-color: #cccccc;
            --btn-gray: #bdc3c7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 4px; /* 🪚 周辺の余白を極限までカット */
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 10px 12px; /* 🪚 内側の縦余白をスマートに削減 */
            border: 2px solid #2ecc71;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: bold;
            color: #27ae60;
        }

        /* 🪚 縦を圧迫していた赤文字を小さく引き締め */
        .sub-header-alert {
            color: var(--text-alert);
            font-weight: bold;
            font-size: 0.8rem;
            margin-bottom: 8px;
            text-align: left;
        }

        .input-box-group {
            margin-bottom: 8px; /* 🪚 隙間を15pxから8pxへ */
            text-align: left;
        }

        .input-label {
            font-size: 0.8rem; /* 🪚 ラベルをコンパクトに */
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 2px;
            display: block;
        }

        .text-field {
            width: 100%;
            height: 38px; /* 🪚 高さを46pxから38pxへスリム化 */
            padding: 6px 10px;
            font-size: 1.1rem;
            font-family: monospace;
            border: 2px solid var(--border-color);
            border-radius: 6px;
        }

        .text-field:focus {
            border-color: #2ecc71;
            outline: none;
        }

        .display-monitor {
            background: var(--bg-display);
            border-radius: 6px;
            padding: 8px 10px; /* 🪚 モニターの縦の厚みをスリム化 */
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .display-text {
            color: var(--text-display);
            font-size: 1.25rem;
            font-family: monospace;
            font-weight: bold;
            letter-spacing: 1px;
            overflow-x: auto;
            white-space: nowrap;
            width: 82%;
            text-align: left;
        }

        .counter-badge {
            color: #2ecc71;
            font-size: 1.7rem;
            font-weight: bold;
            font-family: monospace;
        }

        .guidance-box {
            background: #e8f8f5;
            border: 1px solid #2ecc71;
            border-radius: 6px;
            padding: 6px 8px; /* 🪚 ガイダンスの座布団も薄型化 */
            color: #27ae60;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .clear-action-btn {
            width: 100%;
            height: 36px; /* 🪚 ボタンもスリムに */
            border: none;
            border-radius: 6px;
            background: #95a5a6;
            color: white;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .action-btn {
            display: block;
            width: 100%;
            padding: 11px; /* 🪚 14pxから11pxへ調整 */
            border-radius: 6px;
            border: none;
            color: white;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            background: var(--btn-blue);
        }

        .action-btn:disabled {
            background: var(--btn-gray) !important;
            cursor: not-allowed;
            opacity: 0.5;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>⌨ ハンドの手入力 (.direct)</h1>
        <div style="font-size: 1.2rem;">📝</div>
    </header>
    <div class="sub-header-alert">※プレイヤー用手入力画面</div>

    <div class="input-box-group">
        <label class="input-label">▼ キーボード手入力ボックス</label>
        <input type="text" id="rawTextBox" class="text-field" placeholder="例: SAKHQT9D765C432" autocomplete="off">
    </div>

    <div class="input-box-group">
        <label class="input-label">▼ マトリックス正規化・並び替えモニター</label>
        <div class="display-monitor">
            <div class="display-text" id="displayText"></div>
            <div class="counter-badge" id="cardCounter">0</div>
        </div>
    </div>

    <div class="guidance-box" id="guidanceBox">手札を文字で入力してください。</div>

    <button class="clear-action-btn" id="clearBtn">ボックスを空にする</button>

    <div class="action-container">
        <button id="okActionBtn" class="action-btn" disabled>OK (スプレッドシートへ確定送信)</button>
    </div>
</div>

<script>
    // ⚠️登録係の画面（initialize）の最上部に貼ってあるURL変数を、ここにも1行丸ごとコピペしてください。
  const GAS_URL = "https://script.google.com/macros/s/AKfycbygAPVWSVTInhfQ3cx3-VkQk1WhHVA3iozzCn3--"+
       "FuJh5-DPIRSBFZb4ubCRkTCav-QfQ/exec";
    const RANKS = ['A', 'K', 'Q', 'J', 'T', '9', '8', '7', '6', '5', '4', '3', '2'];
    const SUITS = ['S', 'H', 'D', 'C'];

    let cardMatrix = {
        S: new Array(13).fill(""),
        H: new Array(13).fill(""),
        D: new Array(13).fill(""),
        C: new Array(13).fill("")
    };

    const rawTextBox = document.getElementById('rawTextBox');
    const displayText = document.getElementById('displayText');
    const cardCounter = document.getElementById('cardCounter');
    const guidanceBox = document.getElementById('guidanceBox');
    const okActionBtn = document.getElementById('okActionBtn');
    const clearBtn = document.getElementById('clearBtn');

    function toHalfWidth(str) {
        return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g, function(s) {
            return String.fromCharCode(s.charCodeAt(0) - 0xFEE0);
        });
    }

    function countSelectedCards() {
        let total = 0;
        SUITS.forEach(suit => {
            total += cardMatrix[suit].filter(val => val !== "").length;
        });
        return total;
    }

    rawTextBox.addEventListener('input', () => {
        let rawText = toHalfWidth(rawTextBox.value).toUpperCase().replace(/\s+/g, '');
        rawText = rawText.replace(/10/g, 'T');

        SUITS.forEach(suit => cardMatrix[suit].fill(""));

        let currentParsingSuit = null;
        for (let i = 0; i < rawText.length; i++) {
            const char = rawText[i];
            if (SUITS.includes(char)) {
                currentParsingSuit = char;
            } else if (currentParsingSuit && RANKS.includes(char)) {
                const r_ix = RANKS.indexOf(char);
                cardMatrix[currentParsingSuit][r_ix] = char;
            }
        }

        let resultSegments = [];
        SUITS.forEach(suit => {
            let suitStr = suit;
            let hasCards = false;
            RANKS.forEach(rank => {
                const r_ix = RANKS.indexOf(rank);
                if (cardMatrix[suit][r_ix] !== "") {
                    suitStr += rank;
                    hasCards = true;
                }
            });
            if (hasCards) resultSegments.push(suitStr);
        });

        const generatedText = resultSegments.join('');
        displayText.innerText = generatedText;
        
        const count = countSelectedCards();
        cardCounter.innerText = count;

        if (count === 13) {
            guidanceBox.innerHTML = "<span style='color:var(--btn-blue); font-weight:bold;'>✓ １３枚揃いました。OKボタンを押して下さい。</span>";
            okActionBtn.disabled = false;
        } else if (count > 13) {
            guidanceBox.innerHTML = "<span style='color:var(--text-alert)'>⚠️ 13枚超過（現在" + count + "枚）。文字を削ってください。</span>";
            okActionBtn.disabled = true;
        } else {
            guidanceBox.innerHTML = "現在 " + count + " 枚。13枚ぴったりに入力してください。";
            okActionBtn.disabled = true;
        }
    });

    clearBtn.addEventListener('click', () => {
        rawTextBox.value = "";
        SUITS.forEach(suit => cardMatrix[suit].fill(""));
        displayText.innerText = "";
        cardCounter.innerText = "0";
        guidanceBox.innerHTML = "手札を文字で入力してください。";
        okActionBtn.disabled = true;
    });

    okActionBtn.addEventListener('click', async () => {
        const count = countSelectedCards();
        if (count !== 13) return;

        let bitVector = new Array(52).fill(false);
        let bitPosition = 0;

        SUITS.forEach(suit => {
            RANKS.forEach(rank => {
                const r_ix = RANKS.indexOf(rank);
                if (cardMatrix[suit][r_ix] !== "") bitVector[bitPosition] = true;
                bitPosition++;
            });
        });

        const int1 = bitVector.slice(0, 26).reduce((acc, curr) => { return (acc << 1) | (curr ? 1 : 0); }, 0);
        const int2 = bitVector.slice(26, 52).reduce((acc, curr) => { return (acc << 1) | (curr ? 1 : 0); }, 0);
        let bitString = "";
        for (let i = 0; i < 52; i++) bitString += bitVector[i] ? "1" : "0";

        okActionBtn.disabled = true;
        guidanceBox.innerHTML = "🚀 スプレッドシートへ安全に送信中...";

        try {
            const payload = { action: "send_data", int1: int1, int2: int2, raw: bitString };
const response = await fetch(GAS_URL, {
method: "POST",
mode: "cors",
headers: { "Content-Type": "text/plain" },
body: JSON.stringify(payload)
});
const result = await response.json();
if (result.status === "success") {
guidanceBox.innerHTML = "✨ 送信完了：正確に記録されました！ブラウザを閉じてOKです。";
} else { throw new Error(); }
} catch (error) {
guidanceBox.innerHTML = "⚠️ 送信失敗。再試行するか通信を確認してください。";
okActionBtn.disabled = false;
}
});
</script>
</body>
</html>
